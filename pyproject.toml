[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uncanny-clicker"
version = "1.0.0"
description = "Offline Japanese Windows auto clicker"
requires-python = ">=3.11"
dependencies = ["customtkinter==5.2.2"]

[project.gui-scripts]
uncanny-clicker = "uncanny_clicker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
